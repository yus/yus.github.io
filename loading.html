<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>simple · svg loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #0b0d15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: #141824;
      padding: 3rem 3rem 2.5rem;
      border-radius: 3rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: box-shadow 0.2s;
    }

    /* ---------- SVG container ---------- */
    .loader {
      display: block;
      width: 120px;
      height: 120px;
      margin: 0 auto;
    }

    /* ---------- the thin circle ---------- */
    .ring {
      fill: none;
      stroke: #9bbaff;
      stroke-width: 3.5;          /* thin but visible */
      stroke-linecap: round;
      stroke-dasharray: 220 60;   /* creates a visible gap – makes it a "loading" arc */
      transform-origin: center;
      animation: 
        spin 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite,
        stretch 1.4s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 6px rgba(130, 180, 255, 0.3));
    }

    /* ---------- keyframes: rotate & stretch ---------- */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes stretch {
      0% {
        transform: scale(0.92) rotate(0deg);    /* slightly squished */
        stroke-width: 3.2;
      }
      50% {
        transform: scale(1.08) rotate(180deg);   /* stretched + mid-rotation */
        stroke-width: 4.2;
      }
      100% {
        transform: scale(0.92) rotate(360deg);   /* squished again, full spin */
        stroke-width: 3.2;
      }
    }

    /* subtle pulse on the container – just for extra ✨ */
    .loader {
      animation: breathe 2.8s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      0% { opacity: 0.75; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* ----- simple label ----- */
    .label {
      text-align: center;
      margin-top: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #9bbaff;
      opacity: 0.7;
      font-size: 0.9rem;
      text-transform: uppercase;
      border-top: 1px solid rgba(155, 186, 255, 0.08);
      padding-top: 1.2rem;
    }
    .label span {
      display: inline-block;
      background: #1e2538;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      color: #b4cbff;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    /* small screen */
    @media (max-width: 500px) {
      .card { padding: 2rem 1.8rem 1.8rem; }
      .loader { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- SVG loading spinner: thin circle + stretch + rotation -->
    <svg class="loader" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle class="ring" cx="60" cy="60" r="50" />
    </svg>
    <div class="label">
      <span>⏳ loading</span>
    </div>
  </div>
</body>
</html>
