<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#111; font-family: monospace; }
  #grid {
    width: 600px; height: 800px;
    display: grid;
    grid-template-columns: repeat(13, 44px);
    grid-template-rows: repeat(18, 44px);
  }
  .knob {
    width: 44px; height: 44px;
    font-size: 15px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    background: #222; color: #ddd;
    border: 1px solid #333;
    cursor: pointer; user-select: none; padding: 0;
  }
  .knob:active { background: #555; }
  #display {
    width: 44px; height: 44px;
    background: #000;
    display: block;
  }
</style>
</head>
<body>
<div id="grid"></div>
<script>
  const COLS = 13, ROWS = 18;
  const TOTAL = COLS * ROWS;      // 234
  const KNOBS = TOTAL - 1;        // 233

  const label = i =>
    String.fromCharCode(65 + Math.floor(i / 26)) +
    String.fromCharCode(65 + (i % 26));

  const grid = document.getElementById('grid');

  // 233 knobs
  for (let i = 0; i < KNOBS; i++) {
    const b = document.createElement('button');
    b.className = 'knob';
    b.textContent = label(i);
    b.onclick = () => draw(b.textContent);
    grid.appendChild(b);
  }

  // LAST cell = canvas
  const canvas = document.createElement('canvas');
  canvas.id = 'display';
  canvas.width = 44;
  canvas.height = 44;
  grid.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  function draw(text) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 44, 44);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 22, 22);
  }

  draw('--');
</script>
</body>
</html>
