<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сон Даттарая · SVG-Плеер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Georgia', serif;
            flex-direction: column;
            color: #e0dcc8;
        }
        #dropZone {
            border: 2px dashed #4a5268;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: #1a1f2e;
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        #dropZone:hover { border-color: #e0dcc8; background: #2a3040; }
        #dropZone p { font-size: 14px; color: #7a7f8f; }
        canvas {
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(97, 175, 239, 0.1);
            width: 90%;
            max-width: 1000px;
            height: auto;
            background: #131821;
            display: block;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #2a3040;
            border: none;
            color: #e0dcc8;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        button:hover { background: #4a5268; transform: scale(1.02); }
        #info {
            font-size: 13px;
            color: #7a7f8f;
            font-style: italic;
            margin-top: 10px;
            text-align: center;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="dropZone">
    <p>📂 Перетащите сюда SVG-файл или кликните, чтобы загрузить «Сон Даттарая»</p>
    <input type="file" id="fileInput" accept=".svg">
</div>

<canvas id="canvas" width="1000" height="600"></canvas>

<div id="controls">
    <button id="playBtn">▶ Играть</button>
    <button id="resetBtn">⟲ Сброс</button>
    <span id="status">⏸ ожидание файла</span>
</div>
<div id="info">ритмическая анимация · затактная риторика · 1972 → 6174</div>

<script>
    // ============================================================
    // 1. НАСТРОЙКИ И СОСТОЯНИЕ
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let svgData = null;           // исходный SVG-текст
    let shapes = [];             // массив фигур { type, x, y, w, h, color, points }
    let isPlaying = false;
    let animationId = null;
    let startTime = 0;
    let elapsed = 0;
    const DURATION = 30;         // 30 секунд на весь трек

    // ============================================================
    // 2. ПАРСЕР SVG → ГЕОМЕТРИЯ
    // ============================================================
    function parseSVG(svgText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const svg = doc.documentElement;
        const rects = svg.querySelectorAll('rect, circle, ellipse, line, polyline, polygon, path');
        const items = [];

        rects.forEach(el => {
            const tag = el.tagName.toLowerCase();
            const fill = el.getAttribute('fill') || '#ffffff';
            const stroke = el.getAttribute('stroke') || 'none';
            const color = fill !== 'none' ? fill : stroke;
            const x = parseFloat(el.getAttribute('x')) || 0;
            const y = parseFloat(el.getAttribute('y')) || 0;
            const w = parseFloat(el.getAttribute('width')) || 10;
            const h = parseFloat(el.getAttribute('height')) || 10;
            const r = parseFloat(el.getAttribute('r')) || 5;
            const cx = parseFloat(el.getAttribute('cx')) || 0;
            const cy = parseFloat(el.getAttribute('cy')) || 0;

            if (tag === 'rect') {
                items.push({ type: 'rect', x, y, w, h, color });
            } else if (tag === 'circle') {
                items.push({ type: 'circle', cx, cy, r, color });
            } else if (tag === 'ellipse') {
                const rx = parseFloat(el.getAttribute('rx')) || 5;
                const ry = parseFloat(el.getAttribute('ry')) || 5;
                items.push({ type: 'ellipse', cx, cy, rx, ry, color });
            } else if (tag === 'line') {
                const x1 = parseFloat(el.getAttribute('x1')) || 0;
                const y1 = parseFloat(el.getAttribute('y1')) || 0;
                const x2 = parseFloat(el.getAttribute('x2')) || 0;
                const y2 = parseFloat(el.getAttribute('y2')) || 0;
                items.push({ type: 'line', x1, y1, x2, y2, color });
            } else if (tag === 'polyline' || tag === 'polygon') {
                const pointsAttr = el.getAttribute('points');
                if (pointsAttr) {
                    const pts = pointsAttr.split(' ').map(p => p.split(',').map(Number));
                    items.push({ type: 'poly', points: pts, color });
                }
            } else if (tag === 'path') {
                // упрощённо: берём bounding box
                const bbox = el.getBBox?.();
                if (bbox) {
                    items.push({ type: 'path', x: bbox.x, y: bbox.y, w: bbox.width, h: bbox.height, color });
                } else {
                    items.push({ type: 'path', x: 0, y: 0, w: 20, h: 20, color });
                }
            }
        });

        if (items.length === 0) {
            // фолбэк: если ничего не нашли — генерируем точки на основе чисел 1972 и 6174
            items.push({ type: 'circle', cx: 200, cy: 200, r: 30, color: '#f0a5b0' });
            items.push({ type: 'circle', cx: 400, cy: 300, r: 40, color: '#6fc1b0' });
            items.push({ type: 'circle', cx: 600, cy: 250, r: 25, color: '#d4b87a' });
            items.push({ type: 'circle', cx: 800, cy: 400, r: 50, color: '#8f8fbc' });
            items.push({ type: 'line', x1: 100, y1: 500, x2: 900, y2: 100, color: '#e0dcc8' });
        }

        return items;
    }

    // ============================================================
    // 3. АУДИО-СИНТЕЗ (Web Audio API)
    // ============================================================
    let audioCtx = null;
    let masterGain = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playNote(freq, duration, vol = 0.2, type = 'sine') {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // ============================================================
    // 4. ВИЗУАЛИЗАЦИЯ И АНИМАЦИЯ
    // ============================================================
    function drawShapes(progress) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!shapes.length) {
            ctx.fillStyle = '#7a7f8f';
            ctx.font = '20px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('📂 Загрузите SVG, чтобы начать', canvas.width/2, canvas.height/2);
            return;
        }

        const total = shapes.length;
        const activeCount = Math.floor(progress * total);
        const now = Date.now() / 1000;

        shapes.forEach((shape, idx) => {
            const delay = idx / total;
            const active = idx <= activeCount;
            const pulse = active ? 0.8 + 0.2 * Math.sin(now * 2 + idx) : 0.2;
            const alpha = active ? 0.9 : 0.15;
            const scale = active ? 1 + 0.1 * Math.sin(now * 3 + idx * 0.5) : 0.8;

            ctx.save();
            ctx.globalAlpha = alpha;

            const color = shape.color || '#ffffff';
            ctx.strokeStyle = color;
            ctx.fillStyle = color;

            const x = shape.x || 0, y = shape.y || 0;
            const w = (shape.w || 20) * scale, h = (shape.h || 20) * scale;

            switch (shape.type) {
                case 'rect':
                    ctx.fillRect(x - w/2, y - h/2, w, h);
                    break;
                case 'circle':
                    ctx.beginPath();
                    ctx.arc(shape.cx || 0, shape.cy || 0, (shape.r || 10) * scale, 0, Math.PI*2);
                    ctx.fill();
                    break;
                case 'ellipse':
                    ctx.beginPath();
                    ctx.ellipse(shape.cx || 0, shape.cy || 0, (shape.rx || 10) * scale, (shape.ry || 10) * scale, 0, 0, Math.PI*2);
                    ctx.fill();
                    break;
                case 'line':
                    ctx.beginPath();
                    ctx.moveTo(shape.x1 || 0, shape.y1 || 0);
                    ctx.lineTo(shape.x2 || 0, shape.y2 || 0);
                    ctx.stroke();
                    break;
                case 'poly':
                    ctx.beginPath();
                    const pts = shape.points || [];
                    pts.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p[0], p[1]);
                        else ctx.lineTo(p[0], p[1]);
                    });
                    ctx.closePath();
                    ctx.fill();
                    break;
                default:
                    ctx.fillRect(x, y, w, h);
            }

            ctx.restore();

            // Звук: каждая фигура — нота, когда она становится активной
            if (active && idx === activeCount) {
                const freq = 100 + (idx / total) * 600;
                const dur = 0.15 + (1 - progress) * 0.3;
                const vol = 0.1 + 0.15 * (1 - progress);
                const types = ['sine', 'square', 'sawtooth', 'triangle'];
                const type = types[idx % types.length];
                playNote(freq, dur, vol, type);
            }
        });

        // прорисовка линии прогресса
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = '#e0dcc8';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(progress * canvas.width, 0);
        ctx.lineTo(progress * canvas.width, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        // статус
        ctx.fillStyle = '#7a7f8f';
        ctx.font = '14px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`${Math.round(progress * 100)}%`, canvas.width-20, 30);
        if (shapes.length) {
            ctx.textAlign = 'left';
            ctx.fillText(`фигур: ${shapes.length}`, 20, 30);
        }
    }

    // ============================================================
    // 5. ЗАГРУЗКА ФАЙЛА
    // ============================================================
    function loadSVG(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            svgData = text;
            shapes = parseSVG(text);
            status.textContent = `✅ загружено: ${file.name} (${shapes.length} фигур)`;
            drawShapes(0);
            // автоматическая генерация звуков при загрузке (короткий привет)
            for (let i = 0; i < Math.min(shapes.length, 5); i++) {
                setTimeout(() => {
                    const freq = 200 + i * 80;
                    playNote(freq, 0.1, 0.05, 'sine');
                }, i * 80);
            }
        };
        reader.readAsText(file);
    }

    // ============================================================
    // 6. УПРАВЛЕНИЕ
    // ============================================================
    let progress = 0;

    function play() {
        if (!shapes.length) {
            status.textContent = '⚠️ сначала загрузите SVG-файл';
            return;
        }
        if (isPlaying) {
            // пауза
            isPlaying = false;
            if (animationId) cancelAnimationFrame(animationId);
            playBtn.textContent = '▶ Продолжить';
            status.textContent = '⏸ пауза';
            return;
        }

        initAudio();
        isPlaying = true;
        playBtn.textContent = '⏸ Пауза';
        status.textContent = '▶ играет...';
        if (!startTime) startTime = performance.now();

        function loop() {
            if (!isPlaying) return;
            const now = performance.now();
            const dt = (now - startTime) / 1000;
            progress = Math.min(dt / DURATION, 1);
            drawShapes(progress);
            if (progress < 1) {
                animationId = requestAnimationFrame(loop);
            } else {
                // финал
                isPlaying = false;
                playBtn.textContent = '▶ Играть заново';
                status.textContent = '◼ завершено (тишина)';
                drawShapes(1);
                // последний аккорд
                setTimeout(() => {
                    playNote(110, 2, 0.1, 'sine');
                    playNote(220, 2, 0.08, 'triangle');
                    playNote(330, 2, 0.06, 'sine');
                }, 300);
            }
        }
        loop();
    }

    function resetPlayer() {
        isPlaying = false;
        if (animationId) cancelAnimationFrame(animationId);
        progress = 0;
        startTime = 0;
        playBtn.textContent = '▶ Играть';
        status.textContent = '⟲ сброшено';
        drawShapes(0);
        // короткий звук сброса
        playNote(800, 0.05, 0.05, 'square');
    }

    // ============================================================
    // 7. СОБЫТИЯ
    // ============================================================
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#e0dcc8'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#4a5268'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#4a5268';
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.svg')) loadSVG(file);
        else status.textContent = '❌ нужен файл .svg';
    });
    fileInput.addEventListener('change', (e) => {
        if (fileInput.files[0]) loadSVG(fileInput.files[0]);
    });

    playBtn.addEventListener('click', play);
    resetBtn.addEventListener('click', resetPlayer);

    // начальная прорисовка
    drawShapes(0);
    status.textContent = '⏳ ожидание SVG';

    // подсказка: если нет файла — показываем демо-цифры
    setTimeout(() => {
        if (!shapes.length) {
            shapes = parseSVG(`
                <svg><circle cx="200" cy="200" r="40" fill="#f0a5b0"/>
                <circle cx="500" cy="300" r="50" fill="#6fc1b0"/>
                <circle cx="700" cy="150" r="30" fill="#d4b87a"/>
                <circle cx="850" cy="450" r="60" fill="#8f8fbc"/>
                <line x1="50" y1="500" x2="950" y2="100" stroke="#e0dcc8" stroke-width="4"/>
                </svg>
            `);
            drawShapes(0);
            status.textContent = '💡 демо-фигуры (загрузи свой SVG)';
        }
    }, 500);
</script>
</body>
</html>
