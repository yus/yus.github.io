<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сон Даттарая · Студия числовой музыки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0b0e14; 
            color: #e0dcc8; 
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            padding: 30px;
        }
        .studio {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .canvas-area { 
            background: #131821; 
            border-radius: 24px; 
            padding: 20px;
            box-shadow: 0 0 40px rgba(97, 175, 239, 0.05);
        }
        #svgCanvas {
            width: 100%;
            height: auto;
            background: #1a1f2e;
            border-radius: 16px;
            display: block;
            margin-bottom: 16px;
        }
        .staff-container {
            background: #1a1f2e;
            border-radius: 16px;
            padding: 12px;
            position: relative;
        }
        #staffCanvas {
            width: 100%;
            height: 160px;
            display: block;
            background: #131821;
            border-radius: 8px;
        }
        .info-panel {
            background: #131821;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-panel h2 { font-size: 18px; font-weight: normal; letter-spacing: 2px; color: #7a7f8f; border-bottom: 1px solid #2a3040; padding-bottom: 12px; }
        .preview-mini { 
            background: #1a1f2e; 
            border-radius: 12px; 
            height: 120px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #4a5268;
            font-size: 14px;
            overflow: hidden;
        }
        .preview-mini img, .preview-mini svg { max-width: 100%; max-height: 100%; }
        .description-box {
            background: #1a1f2e;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            color: #b0b8c8;
            min-height: 80px;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls button, .controls select, .controls input {
            background: #2a3040;
            border: none;
            color: #e0dcc8;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            flex: 1;
        }
        .controls button:hover { background: #4a5268; }
        .controls select { background: #1a1f2e; border: 1px solid #2a3040; }
        .tempo-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1a1f2e;
            padding: 10px 16px;
            border-radius: 40px;
        }
        .tempo-controls input[type="range"] {
            flex: 2;
            background: transparent;
            accent-color: #e0dcc8;
        }
        .toggle {
            background: #2a3040;
            border: none;
            color: #e0dcc8;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .toggle.active { background: #4a5268; box-shadow: 0 0 20px rgba(97, 175, 239, 0.2); }
        .status-text { font-size: 13px; color: #7a7f8f; text-align: center; }
        .drop-zone {
            border: 2px dashed #2a3040;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #4a5268;
            cursor: pointer;
            transition: 0.3s;
        }
        .drop-zone:hover { border-color: #e0dcc8; background: #1a1f2e; }
        #fileInput { display: none; }
        .sequence-display {
            font-family: monospace;
            font-size: 12px;
            color: #7a7f8f;
            text-align: center;
            padding: 8px;
            background: #0b0e14;
            border-radius: 8px;
            border: 1px solid #1a1f2e;
            word-break: break-all;
        }
        @media (max-width: 900px) {
            .studio { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="studio">
    <!-- ЛЕВАЯ КОЛОНКА: ВИЗУАЛ И НОТЫ -->
    <div class="canvas-area">
        <canvas id="svgCanvas" width="800" height="450"></canvas>
        <div class="staff-container">
            <canvas id="staffCanvas" width="800" height="160"></canvas>
            <div class="sequence-display" id="sequenceDisplay">⏳ Ожидание партитуры</div>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: ИНФО И НАСТРОЙКИ -->
    <div class="info-panel">
        <div class="drop-zone" id="dropZone">
            <p>📂 Перетащите <strong>SVG</strong> или кликните</p>
            <input type="file" id="fileInput" accept=".svg">
        </div>

        <h2>📄 Карточка произведения</h2>
        <div class="preview-mini" id="miniPreview">⏳ Ожидание файла</div>
        <div class="description-box" id="descBox">
            <span style="color:#4a5268;">Описание появится из тега &lt;desc&gt; в SVG...</span>
        </div>

        <h2>🎚️ Настройки трека</h2>
        <div class="controls">
            <button id="playBtn">▶ Играть</button>
            <button id="resetBtn">⟲ Сброс</button>
            <button id="arpeggioToggle" class="toggle active">🎹 Арпеджио</button>
            <select id="instrumentSelect">
                <option value="sitar">🎸 Ситар</option>
                <option value="piano" selected>🎹 Фортепиано</option>
            </select>
        </div>
        <div class="tempo-controls">
            <span>🐢</span>
            <input type="range" id="bpmSlider" min="30" max="180" value="80">
            <span>🐇</span>
            <span id="bpmDisplay">80 BPM</span>
        </div>
        <div class="status-text" id="status">⏸ Готов к загрузке партитуры</div>
    </div>
</div>

<script>
    // ================================================================
    // 1. СОСТОЯНИЕ И НАСТРОЙКИ
    // ================================================================
    const svgCanvas = document.getElementById('svgCanvas');
    const svgCtx = svgCanvas.getContext('2d');
    const staffCanvas = document.getElementById('staffCanvas');
    const staffCtx = staffCanvas.getContext('2d');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');
    const descBox = document.getElementById('descBox');
    const miniPreview = document.getElementById('miniPreview');
    const instrumentSelect = document.getElementById('instrumentSelect');
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const arpeggioToggle = document.getElementById('arpeggioToggle');
    const sequenceDisplay = document.getElementById('sequenceDisplay');

    let shapes = [];
    let isPlaying = false;
    let animationId = null;
    let startTime = 0;
    let progress = 0;
    let currentCycle = [1972, 8442, 5994, 5355, 1998, 8082, 8532, 6174];
    let audioCtx = null;
    let masterGain = null;
    let currentInstrument = 'piano';
    let bpm = 80;
    let arpeggioMode = true;
    let fileName = '';

    // "Великая 30-ка" — числа, идущие к 6174 за 7 шагов (пример)
    const GREAT_30 = [
        1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979,
        1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987,
        1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995,
        1996, 1997, 1998, 1999, 2000, 2001
    ];

    // Хардкод для "Сна Даттарая"
    const DREAM_CYCLE = [1972, 8442, 5994, 5355, 1998, 8082, 8532, 6174];

    // Частоты для нот (на основе 1-9)
    const freqMap = { 0: 0, 1: 110, 2: 123.47, 3: 138.59, 4: 146.83, 5: 164.81, 6: 185.0, 7: 196.0, 8: 220.0, 9: 246.94 };

    // ================================================================
    // 2. АУДИО-СИНТЕЗ
    // ================================================================
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.35;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playNote(freq, duration, vol = 0.2, instrument = 'piano') {
        if (!audioCtx || freq === 0) return;
        const now = audioCtx.currentTime;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
        gainNode.connect(masterGain);

        if (instrument === 'sitar') {
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = freq * 2.2;
            filter.Q.value = 1.5;
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            osc.connect(filter);
            filter.connect(gainNode);
            osc.start(now);
            osc.stop(now + duration);
            // Обертон
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            gain2.gain.setValueAtTime(vol * 0.15, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.4);
            osc2.type = 'triangle';
            osc2.frequency.value = freq * 3.0;
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(now);
            osc2.stop(now + duration * 0.4);
        } else {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gainNode);
            osc.start(now);
            osc.stop(now + duration);
            // Лёгкий обертон
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            gain2.gain.setValueAtTime(vol * 0.08, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.25);
            osc2.type = 'sine';
            osc2.frequency.value = freq * 2.0;
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(now);
            osc2.stop(now + duration * 0.25);
        }
    }

    function playClick(freq, vol) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.02);
    }

    // ================================================================
    // 3. АЛГОРИТМ КАПРЕКАРА
    // ================================================================
    function kaprekarStep(num) {
        const str = String(num).padStart(4, '0');
        const digits = str.split('').map(Number);
        const asc = digits.slice().sort((a,b) => a-b);
        const desc = digits.slice().sort((a,b) => b-a);
        const ascNum = parseInt(asc.join(''));
        const descNum = parseInt(desc.join(''));
        return descNum - ascNum;
    }

    function generateCycleFrom(start) {
        const cycle = [start];
        let current = start;
        while (current !== 6174 && cycle.length < 10) {
            current = kaprekarStep(current);
            cycle.push(current);
        }
        return cycle;
    }

    // ================================================================
    // 4. ПАРСЕР SVG
    // ================================================================
    function extractNumbersFromSVG(svgText, name) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const textNodes = doc.querySelectorAll('text');
        const numbers = [];
        
        textNodes.forEach(node => {
            const text = node.textContent.trim();
            if (/^\d{4}$/.test(text)) {
                numbers.push(parseInt(text));
            }
        });

        // Если это "Сон Даттарая" — возвращаем хардкод
        if (name.toLowerCase().includes('dattatreyasdream')) {
            return DREAM_CYCLE;
        }

        // Ищем первое число, отличное от 1972
        const firstNon1972 = numbers.find(n => n !== 1972);
        if (firstNon1972) {
            return generateCycleFrom(firstNon1972);
        }

        // Если нашли только 1972 или ничего — берём из "Великой 30-ки"
        if (numbers.length > 0 && numbers[0] === 1972) {
            const randomFromGreat = GREAT_30[Math.floor(Math.random() * GREAT_30.length)];
            return generateCycleFrom(randomFromGreat);
        }

        // Фолбэк
        return generateCycleFrom(1972);
    }

    function parseSVGShapes(svgText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const elements = doc.querySelectorAll('rect, circle, ellipse, line, polyline, polygon, path');
        const items = [];
        elements.forEach(el => {
            const tag = el.tagName.toLowerCase();
            const fill = el.getAttribute('fill') || '#ffffff';
            const color = fill !== 'none' ? fill : '#ffffff';
            if (tag === 'circle') {
                const cx = parseFloat(el.getAttribute('cx')) || 0;
                const cy = parseFloat(el.getAttribute('cy')) || 0;
                const r = parseFloat(el.getAttribute('r')) || 10;
                items.push({ type: 'circle', cx, cy, r, color });
            } else if (tag === 'rect') {
                const x = parseFloat(el.getAttribute('x')) || 0;
                const y = parseFloat(el.getAttribute('y')) || 0;
                const w = parseFloat(el.getAttribute('width')) || 20;
                const h = parseFloat(el.getAttribute('height')) || 20;
                items.push({ type: 'rect', x, y, w, h, color });
            }
        });
        if (items.length === 0) {
            // Демо-фигуры
            items.push({ type: 'circle', cx: 200, cy: 200, r: 40, color: '#f0a5b0' });
            items.push({ type: 'circle', cx: 500, cy: 300, r: 50, color: '#6fc1b0' });
            items.push({ type: 'circle', cx: 700, cy: 150, r: 30, color: '#d4b87a' });
        }
        return items;
    }

    // ================================================================
    // 5. ОТРИСОВКА
    // ================================================================
    function drawShapes(progressVal) {
        svgCtx.clearRect(0, 0, svgCanvas.width, svgCanvas.height);
        if (!shapes.length) {
            svgCtx.fillStyle = '#4a5268';
            svgCtx.font = '24px Georgia';
            svgCtx.textAlign = 'center';
            svgCtx.fillText('📂 Загрузите SVG-партитуру', svgCanvas.width/2, svgCanvas.height/2);
            return;
        }

        const now = Date.now() / 1000;
        const total = shapes.length;
        const activeCount = Math.floor(progressVal * total);

        shapes.forEach((shape, idx) => {
            const active = idx <= activeCount;
            const alpha = active ? 0.8 + 0.2 * Math.sin(now * 2 + idx) : 0.15;
            const scale = active ? 1 + 0.08 * Math.sin(now * 3 + idx) : 0.7;

            svgCtx.save();
            svgCtx.globalAlpha = alpha;
            svgCtx.fillStyle = shape.color;
            svgCtx.strokeStyle = shape.color;

            if (shape.type === 'circle') {
                svgCtx.beginPath();
                svgCtx.arc(shape.cx, shape.cy, (shape.r || 10) * scale, 0, Math.PI * 2);
                svgCtx.fill();
            } else if (shape.type === 'rect') {
                svgCtx.fillRect(shape.x - 10, shape.y - 10, 20 * scale, 20 * scale);
            }
            svgCtx.restore();
        });

        // Линия прогресса
        svgCtx.globalAlpha = 0.3;
        svgCtx.strokeStyle = '#e0dcc8';
        svgCtx.setLineDash([6, 6]);
        svgCtx.beginPath();
        svgCtx.moveTo(progressVal * svgCanvas.width, 0);
        svgCtx.lineTo(progressVal * svgCanvas.width, svgCanvas.height);
        svgCtx.stroke();
        svgCtx.setLineDash([]);

        // Отрисовка нотного стана
        drawStaff(progressVal);
    }

    function drawStaff(progressVal) {
        staffCtx.clearRect(0, 0, staffCanvas.width, staffCanvas.height);
        staffCtx.fillStyle = '#131821';
        staffCtx.fillRect(0, 0, staffCanvas.width, staffCanvas.height);

        // Линии стана
        staffCtx.strokeStyle = '#4a5268';
        staffCtx.lineWidth = 1;
        const staffY = 20;
        for (let i = 0; i < 5; i++) {
            const y = staffY + i * 12;
            staffCtx.beginPath();
            staffCtx.moveTo(20, y);
            staffCtx.lineTo(staffCanvas.width - 20, y);
            staffCtx.stroke();
        }

        // Скрипичный ключ
        staffCtx.fillStyle = '#7a7f8f';
        staffCtx.font = '40px Georgia';
        staffCtx.fillText('𝄞', 8, staffY + 40);

        const cycle = currentCycle;
        const step = (staffCanvas.width - 120) / cycle.length;

        // Обновляем отображение последовательности
        sequenceDisplay.textContent = `🎵 ${cycle.join(' → ')}`;

        cycle.forEach((num, idx) => {
            const x = 60 + idx * step;
            const isActive = idx <= (progressVal * cycle.length);
            const digits = String(num).split('').map(Number);

            staffCtx.globalAlpha = isActive ? 0.9 : 0.2;

            // Рисуем ноты для каждой цифры
            digits.forEach((n, noteIdx) => {
                if (n === 0) return;
                const noteY = staffY + 50 - (n / 9) * 38;
                const offset = noteIdx * 6 - 10;
                staffCtx.beginPath();
                staffCtx.arc(x + offset, noteY, 5, 0, Math.PI * 2);
                staffCtx.fillStyle = isActive ? '#e0dcc8' : '#4a5268';
                staffCtx.fill();
                staffCtx.strokeStyle = '#e0dcc8';
                staffCtx.lineWidth = 0.5;
                staffCtx.stroke();
            });

            // Подпись числа
            staffCtx.fillStyle = isActive ? '#e0dcc8' : '#2a3040';
            staffCtx.font = '12px monospace';
            staffCtx.textAlign = 'center';
            staffCtx.fillText(num, x, staffY + 80);

            // Тактовые черты
            if (idx > 0) {
                staffCtx.beginPath();
                staffCtx.moveTo(x - step/2, staffY - 5);
                staffCtx.lineTo(x - step/2, staffY + 65);
                staffCtx.strokeStyle = '#3a4050';
                staffCtx.lineWidth = 1;
                staffCtx.stroke();
            }
        });

        // Линия текущей позиции
        if (progressVal > 0) {
            const activeX = 60 + (progressVal * cycle.length) * step;
            staffCtx.strokeStyle = '#f0a5b0';
            staffCtx.lineWidth = 2;
            staffCtx.setLineDash([4, 4]);
            staffCtx.beginPath();
            staffCtx.moveTo(activeX, staffY - 10);
            staffCtx.lineTo(activeX, staffY + 80);
            staffCtx.stroke();
            staffCtx.setLineDash([]);
        }

        staffCtx.globalAlpha = 1;
        status.textContent = `⏳ Такт ${Math.min(Math.floor(progressVal * cycle.length) + 1, cycle.length)} из ${cycle.length} · ${Math.round(progressVal * 100)}%`;
    }

    // ================================================================
    // 6. ВОСПРОИЗВЕДЕНИЕ
    // ================================================================
    function play() {
        if (!shapes.length) {
            status.textContent = '⚠️ Сначала загрузите SVG-файл';
            return;
        }
        if (isPlaying) {
            isPlaying = false;
            if (animationId) cancelAnimationFrame(animationId);
            playBtn.textContent = '▶ Продолжить';
            status.textContent = '⏸ Пауза';
            return;
        }

        initAudio();
        isPlaying = true;
        playBtn.textContent = '⏸ Пауза';
        status.textContent = '▶ Играет...';
        if (!startTime) startTime = performance.now();
        currentInstrument = instrumentSelect.value;

        const cycle = currentCycle;
        const totalBeats = cycle.length * 4; // 4 четверти на такт
        const beatDuration = 60 / bpm;

        let currentBeat = 0;

        function loop() {
            if (!isPlaying) return;
            const now = performance.now();
            const dt = (now - startTime) / 1000;
            const totalDuration = totalBeats * beatDuration;
            progress = Math.min(dt / totalDuration, 1);
            drawShapes(progress);

            const currentChordIndex = Math.min(Math.floor(progress * cycle.length), cycle.length - 1);
            const chord = cycle[currentChordIndex];
            const digits = String(chord).split('').map(Number);

            // Воспроизведение аккорда или арпеджио
            const beatInChord = (dt % (beatDuration * 4)) / beatDuration;
            if (arpeggioMode) {
                digits.forEach((n, i) => {
                    const noteStart = (i / digits.length) * beatDuration * 4;
                    if (Math.abs(beatInChord - (i / digits.length)) < 0.01) {
                        const freq = freqMap[n] || 110;
                        playNote(freq, beatDuration * 0.8, 0.15, currentInstrument);
                    }
                });
            } else {
                if (beatInChord < 0.05) {
                    digits.forEach((n) => {
                        const freq = freqMap[n] || 110;
                        playNote(freq, beatDuration * 3.5, 0.12, currentInstrument);
                    });
                }
            }

            // Метроном
            if (Math.abs(beatInChord) < 0.01) {
                playClick(800, 0.05);
            } else if (Math.abs(beatInChord - 0.25) < 0.01 || 
                       Math.abs(beatInChord - 0.5) < 0.01 || 
                       Math.abs(beatInChord - 0.75) < 0.01) {
                playClick(600, 0.03);
            }

            if (progress < 1) {
                animationId = requestAnimationFrame(loop);
            } else {
                isPlaying = false;
                playBtn.textContent = '▶ Играть заново';
                status.textContent = '◼ Завершено (тишина)';
                drawShapes(1);
                // Финальный аккорд
                setTimeout(() => {
                    playNote(110, 2.5, 0.08, currentInstrument);
                    playNote(220, 2.5, 0.06, currentInstrument);
                    playNote(330, 2.5, 0.04, currentInstrument);
                }, 200);
            }
        }
        loop();
    }

    function resetPlayer() {
        isPlaying = false;
        if (animationId) cancelAnimationFrame(animationId);
        progress = 0;
        startTime = 0;
        playBtn.textContent = '▶ Играть';
        status.textContent = '⟲ Сброшено';
        drawShapes(0);
        playClick(1000, 0.05);
    }

    // ================================================================
    // 7. ЗАГРУЗКА ФАЙЛА
    // ================================================================
    function loadSVG(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            fileName = file.name;

            // Извлекаем числа и генерируем цикл
            currentCycle = extractNumbersFromSVG(text, fileName);

            // Парсим фигуры
            shapes = parseSVGShapes(text);

            // Мини-превью
            miniPreview.innerHTML = `✅ <span style="color:#6fc1b0;">${file.name}</span> (${shapes.length} фигур, ${currentCycle.length} тактов)`;

            // Описание
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'image/svg+xml');
            const descEl = doc.querySelector('desc');
            if (descEl) {
                descBox.innerHTML = `<span style="color:#b0b8c8;">${descEl.textContent}</span>`;
            } else {
                descBox.innerHTML = `<span style="color:#4a5268;">ℹ️ Нет тега &lt;desc&gt;. Добавьте описание в SVG.</span>`;
            }

            drawShapes(0);
            status.textContent = `✅ Загружено: ${file.name} (цикл: ${currentCycle.join('→')})`;

            // Короткий привет
            for (let i = 0; i < Math.min(shapes.length, 3); i++) {
                setTimeout(() => { playNote(200 + i * 80, 0.1, 0.03, 'piano'); }, i * 80);
            }
        };
        reader.readAsText(file);
    }

    // ================================================================
    // 8. СОБЫТИЯ
    // ================================================================
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#e0dcc8'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#2a3040'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#2a3040';
        const file = e.dataTransfer.files[0];
        if (file && (file.name.endsWith('.svg') || file.name.endsWith('.xml'))) {
            loadSVG(file);
        } else {
            status.textContent = '❌ Нужен файл .svg или .xml';
        }
    });
    fileInput.addEventListener('change', (e) => {
        if (fileInput.files[0]) loadSVG(fileInput.files[0]);
    });

    playBtn.addEventListener('click', play);
    resetBtn.addEventListener('click', resetPlayer);

    arpeggioToggle.addEventListener('click', () => {
        arpeggioMode = !arpeggioMode;
        arpeggioToggle.classList.toggle('active');
        arpeggioToggle.textContent = arpeggioMode ? '🎹 Арпеджио' : '🎵 Аккорд';
        status.textContent = arpeggioMode ? '🔄 Арпеджио включено' : '🔴 Арпеджио выключено (аккорды)';
    });

    bpmSlider.addEventListener('input', (e) => {
        bpm = parseInt(e.target.value);
        bpmDisplay.textContent = `${bpm} BPM`;
    });

    instrumentSelect.addEventListener('change', () => {
        currentInstrument = instrumentSelect.value;
        status.textContent = `🎸 Инструмент: ${currentInstrument === 'sitar' ? 'Ситар' : 'Фортепиано'}`;
    });

    // Старт
    drawShapes(0);
    status.textContent = '⏳ Ожидание SVG-партитуры';
    sequenceDisplay.textContent = '⏳ Загрузите файл, чтобы увидеть последовательность';
</script>
</body>
</html>
