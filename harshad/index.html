<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сон Даттарая · Партитура</title>
    <style>
        /* --- Стили для тёмной студийной атмосферы --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0b0e14; 
            color: #e0dcc8; 
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            padding: 30px;
        }
        .studio {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        /* Левая колонка: Холст SVG + Нотный стан */
        .canvas-area { 
            background: #131821; 
            border-radius: 24px; 
            padding: 20px;
            box-shadow: 0 0 40px rgba(97, 175, 239, 0.05);
        }
        #svgCanvas {
            width: 100%;
            height: auto;
            background: #1a1f2e;
            border-radius: 16px;
            display: block;
            margin-bottom: 16px;
        }
        .staff-container {
            background: #1a1f2e;
            border-radius: 16px;
            padding: 12px;
            position: relative;
        }
        #staffCanvas {
            width: 100%;
            height: 140px;
            display: block;
            background: #131821;
            border-radius: 8px;
        }
        /* Правая колонка: Карточка и настройки */
        .info-panel {
            background: #131821;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-panel h2 { font-size: 18px; font-weight: normal; letter-spacing: 2px; color: #7a7f8f; border-bottom: 1px solid #2a3040; padding-bottom: 12px; }
        .preview-mini { 
            background: #1a1f2e; 
            border-radius: 12px; 
            height: 120px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #4a5268;
            font-size: 14px;
        }
        .description-box {
            background: #1a1f2e;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            color: #b0b8c8;
            min-height: 80px;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls button {
            background: #2a3040;
            border: none;
            color: #e0dcc8;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            flex: 1;
        }
        .controls button:hover { background: #4a5268; }
        .instrument-select {
            background: #1a1f2e;
            border: 1px solid #2a3040;
            color: #e0dcc8;
            padding: 8px 16px;
            border-radius: 40px;
            font-family: inherit;
            cursor: pointer;
        }
        .status-text { font-size: 13px; color: #7a7f8f; text-align: center; }
        .drop-zone {
            border: 2px dashed #2a3040;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #4a5268;
            cursor: pointer;
            transition: 0.3s;
        }
        .drop-zone:hover { border-color: #e0dcc8; background: #1a1f2e; }
        #fileInput { display: none; }

        /* --- Глобальные медиа-настройки для адаптации --- */
        @media (max-width: 900px) {
            .studio { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="studio">
    <!-- ЛЕВАЯ КОЛОНКА: ВИЗУАЛ И НОТЫ -->
    <div class="canvas-area">
        <canvas id="svgCanvas" width="800" height="450"></canvas>
        <div class="staff-container">
            <canvas id="staffCanvas" width="800" height="140"></canvas>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: ИНФО И НАСТРОЙКИ -->
    <div class="info-panel">
        <div class="drop-zone" id="dropZone">
            <p>📂 Перетащите <strong>SVG</strong> или кликните</p>
            <input type="file" id="fileInput" accept=".svg">
        </div>

        <h2>📄 Карточка произведения</h2>
        <div class="preview-mini" id="miniPreview">⏳ Ожидание файла</div>
        <div class="description-box" id="descBox">
            <span style="color:#4a5268;">Описание появится здесь, если SVG содержит тег &lt;desc&gt;...</span>
        </div>

        <h2>🎚️ Настройки трека</h2>
        <div class="controls">
            <button id="playBtn">▶ Играть</button>
            <button id="resetBtn">⟲ Сброс</button>
            <select id="instrumentSelect" class="instrument-select">
                <option value="sitar">🎸 Ситар</option>
                <option value="piano" selected>🎹 Фортепиано</option>
            </select>
        </div>
        <div class="status-text" id="status">⏸ Готов к загрузке партитуры</div>
    </div>
</div>

<script>
    // ================================================================
    // 1. СОСТОЯНИЕ И НАСТРОЙКИ
    // ================================================================
    const svgCanvas = document.getElementById('svgCanvas');
    const svgCtx = svgCanvas.getContext('2d');
    const staffCanvas = document.getElementById('staffCanvas');
    const staffCtx = staffCanvas.getContext('2d');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');
    const descBox = document.getElementById('descBox');
    const miniPreview = document.getElementById('miniPreview');
    const instrumentSelect = document.getElementById('instrumentSelect');

    let shapes = [];
    let isPlaying = false;
    let animationId = null;
    let startTime = 0;
    let progress = 0;
    const DURATION = 30; // секунд
    let audioCtx = null;
    let masterGain = null;
    let currentInstrument = 'piano';

    // Наши аккорды для 7 шагов (по 4 ноты, где 0 = пауза)
    const chordMap = [
        { name: '1972', notes: [1, 9, 7, 2] },
        { name: '8442', notes: [8, 4, 4, 2] },
        { name: '5994', notes: [5, 9, 9, 4] },
        { name: '5355', notes: [5, 3, 5, 5] },
        { name: '1998', notes: [1, 9, 9, 8] },
        { name: '8082', notes: [8, 0, 8, 2] },
        { name: '8532', notes: [8, 5, 3, 2] },
        { name: '6174', notes: [6, 1, 7, 4] }
    ];

    // ================================================================
    // 2. АУДИО: СИТАР И ФОРТЕПИАНО (упрощённые модели)
    // ================================================================
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.35;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playNote(freq, duration, vol = 0.2, instrument = 'piano') {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (instrument === 'sitar') {
            // Ситар: несколько обертонов с характерным "гнусавым" фильтром
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = freq * 2.2;
            filter.Q.value = 1.5;
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol * 0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 1.2);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + duration * 1.2);
            // Добавим ещё один обертон для "струнности"
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.value = freq * 3.0;
            gain2.gain.setValueAtTime(vol * 0.2, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.6);
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(now);
            osc2.stop(now + duration * 0.6);
        } else {
            // Фортепиано: простой синтез с быстрой атакой
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + duration);
            // Добавим лёгкий "колокольчик" (высокий обертон)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.value = freq * 2.0;
            gain2.gain.setValueAtTime(vol * 0.08, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.3);
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(now);
            osc2.stop(now + duration * 0.3);
        }
    }

    // ================================================================
    // 3. ПАРСЕР SVG (с чтением <desc> для карточки)
    // ================================================================
    function parseSVG(svgText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const svg = doc.documentElement;
        
        // Ищем описание
        const descEl = svg.querySelector('desc');
        if (descEl) {
            descBox.innerHTML = `<span style="color:#b0b8c8;">${descEl.textContent}</span>`;
        } else {
            descBox.innerHTML = `<span style="color:#4a5268;">ℹ️ Нет тега &lt;desc&gt;. Добавьте описание в SVG.</span>`;
        }

        // Парсим фигуры (упрощённо, как в предыдущей версии)
        const elements = svg.querySelectorAll('rect, circle, ellipse, line, polyline, polygon, path');
        const items = [];
        elements.forEach(el => {
            const tag = el.tagName.toLowerCase();
            const fill = el.getAttribute('fill') || '#ffffff';
            const color = fill !== 'none' ? fill : '#ffffff';
            const x = parseFloat(el.getAttribute('x')) || 0;
            const y = parseFloat(el.getAttribute('y')) || 0;
            const w = parseFloat(el.getAttribute('width')) || 20;
            const h = parseFloat(el.getAttribute('height')) || 20;
            const r = parseFloat(el.getAttribute('r')) || 10;
            const cx = parseFloat(el.getAttribute('cx')) || 0;
            const cy = parseFloat(el.getAttribute('cy')) || 0;
            if (tag === 'circle') {
                items.push({ type: 'circle', cx, cy, r, color });
            } else if (tag === 'rect') {
                items.push({ type: 'rect', x, y, w, h, color });
            } // ... остальные типы для краткости опущены, но в боевой версии будут все
        });
        if (items.length === 0) {
            // Демо-фигуры
            items.push({ type: 'circle', cx: 200, cy: 200, r: 40, color: '#f0a5b0' });
            items.push({ type: 'circle', cx: 500, cy: 300, r: 50, color: '#6fc1b0' });
            items.push({ type: 'circle', cx: 700, cy: 150, r: 30, color: '#d4b87a' });
        }
        return items;
    }

    // ================================================================
    // 4. ОТРИСОВКА: SVG + НОТНЫЙ СТАН
    // ================================================================
    function drawShapes(progressVal) {
        // --- Очистка холста SVG ---
        svgCtx.clearRect(0, 0, svgCanvas.width, svgCanvas.height);
        if (!shapes.length) {
            svgCtx.fillStyle = '#4a5268';
            svgCtx.font = '24px Georgia';
            svgCtx.textAlign = 'center';
            svgCtx.fillText('📂 Загрузите SVG-партитуру', svgCanvas.width/2, svgCanvas.height/2);
            return;
        }

        // Рисуем фигуры с пульсацией
        const now = Date.now() / 1000;
        const total = shapes.length;
        const activeCount = Math.floor(progressVal * total);

        shapes.forEach((shape, idx) => {
            const active = idx <= activeCount;
            const alpha = active ? 0.8 + 0.2 * Math.sin(now * 2 + idx) : 0.15;
            const scale = active ? 1 + 0.08 * Math.sin(now * 3 + idx) : 0.7;

            svgCtx.save();
            svgCtx.globalAlpha = alpha;
            svgCtx.fillStyle = shape.color;
            svgCtx.strokeStyle = shape.color;

            if (shape.type === 'circle') {
                svgCtx.beginPath();
                svgCtx.arc(shape.cx, shape.cy, (shape.r || 10) * scale, 0, Math.PI * 2);
                svgCtx.fill();
            } else if (shape.type === 'rect') {
                svgCtx.fillRect(shape.x - 10, shape.y - 10, 20 * scale, 20 * scale);
            }
            svgCtx.restore();
        });

        // Линия прогресса
        svgCtx.globalAlpha = 0.3;
        svgCtx.strokeStyle = '#e0dcc8';
        svgCtx.setLineDash([6, 6]);
        svgCtx.beginPath();
        svgCtx.moveTo(progressVal * svgCanvas.width, 0);
        svgCtx.lineTo(progressVal * svgCanvas.width, svgCanvas.height);
        svgCtx.stroke();
        svgCtx.setLineDash([]);

        // --- Отрисовка нотного стана ---
        staffCtx.clearRect(0, 0, staffCanvas.width, staffCanvas.height);
        staffCtx.fillStyle = '#131821';
        staffCtx.fillRect(0, 0, staffCanvas.width, staffCanvas.height);
        
        // Линии стана (5 линий)
        staffCtx.strokeStyle = '#4a5268';
        staffCtx.lineWidth = 1;
        const staffY = 20;
        for (let i = 0; i < 5; i++) {
            const y = staffY + i * 12;
            staffCtx.beginPath();
            staffCtx.moveTo(20, y);
            staffCtx.lineTo(staffCanvas.width - 20, y);
            staffCtx.stroke();
        }

        // Скрипичный ключ (упрощённо)
        staffCtx.fillStyle = '#7a7f8f';
        staffCtx.font = '40px Georgia';
        staffCtx.fillText('𝄞', 8, staffY + 40);

        // Ноты: 7 аккордов
        const noteNames = ['До', 'Ре', 'Ми', 'Фа', 'Соль', 'Ля', 'Си'];
        const step = (staffCanvas.width - 120) / 8;
        chordMap.forEach((chord, chordIdx) => {
            const x = 60 + chordIdx * step;
            const isActive = chordIdx <= (progressVal * 7);
            staffCtx.globalAlpha = isActive ? 0.9 : 0.2;

            chord.notes.forEach((n, noteIdx) => {
                if (n === 0) return; // пауза
                const noteY = staffY + 50 - (n / 9) * 38; // высота от 9 (верх) до 1 (низ)
                const offset = noteIdx * 6 - 10;
                // Круг ноты
                staffCtx.beginPath();
                staffCtx.arc(x + offset, noteY, 6, 0, Math.PI * 2);
                staffCtx.fillStyle = isActive ? '#e0dcc8' : '#4a5268';
                staffCtx.fill();
                staffCtx.strokeStyle = '#e0dcc8';
                staffCtx.lineWidth = 1;
                staffCtx.stroke();
                // Подпись ноты (для красоты)
                if (isActive) {
                    staffCtx.fillStyle = '#7a7f8f';
                    staffCtx.font = '9px monospace';
                    staffCtx.textAlign = 'center';
                    staffCtx.fillText(noteNames[n-1] || n, x + offset, noteY - 12);
                }
            });

            // Подпись числа под станом
            staffCtx.fillStyle = isActive ? '#e0dcc8' : '#2a3040';
            staffCtx.font = '12px monospace';
            staffCtx.textAlign = 'center';
            staffCtx.fillText(chord.name, x, staffY + 80);
        });

        // Линия текущего такта
        if (progressVal > 0) {
            const activeX = 60 + (progressVal * 7) * step;
            staffCtx.strokeStyle = '#f0a5b0';
            staffCtx.lineWidth = 2;
            staffCtx.setLineDash([4, 4]);
            staffCtx.beginPath();
            staffCtx.moveTo(activeX, staffY - 10);
            staffCtx.lineTo(activeX, staffY + 80);
            staffCtx.stroke();
            staffCtx.setLineDash([]);
        }

        staffCtx.globalAlpha = 1;
        status.textContent = `⏳ Шаг ${Math.min(Math.floor(progressVal * 7) + 1, 8)} из 8 · ${Math.round(progressVal * 100)}%`;
    }

    // ================================================================
    // 5. УПРАВЛЕНИЕ ВОСПРОИЗВЕДЕНИЕМ
    // ================================================================
    function play() {
        if (!shapes.length) {
            status.textContent = '⚠️ Сначала загрузите SVG-файл';
            return;
        }
        if (isPlaying) {
            isPlaying = false;
            if (animationId) cancelAnimationFrame(animationId);
            playBtn.textContent = '▶ Продолжить';
            status.textContent = '⏸ Пауза';
            return;
        }

        initAudio();
        isPlaying = true;
        playBtn.textContent = '⏸ Пауза';
        status.textContent = '▶ Играет...';
        if (!startTime) startTime = performance.now();
        currentInstrument = instrumentSelect.value;

        function loop() {
            if (!isPlaying) return;
            const now = performance.now();
            const dt = (now - startTime) / 1000;
            progress = Math.min(dt / DURATION, 1);
            drawShapes(progress);

            // Генерация звука на основе текущего аккорда (каждый шаг)
            const chordIndex = Math.floor(progress * 7);
            if (chordIndex < 7) {
                const chord = chordMap[chordIndex];
                chord.notes.forEach((n, i) => {
                    if (n === 0) return;
                    const freq = 110 + n * 30; // привязка к частоте
                    const vol = 0.08 + (1 - progress) * 0.12;
                    // Играем ноту, если она только что стала активной (для простоты — с небольшой задержкой)
                    if (Math.abs(progress - (chordIndex / 7)) < 0.01) {
                        setTimeout(() => {
                            playNote(freq, 0.3, vol, currentInstrument);
                        }, i * 60);
                    }
                });
            }

            if (progress < 1) {
                animationId = requestAnimationFrame(loop);
            } else {
                isPlaying = false;
                playBtn.textContent = '▶ Играть заново';
                status.textContent = '◼ Завершено (тишина)';
                drawShapes(1);
                // Финальный аккорд тишины
                setTimeout(() => {
                    playNote(110, 2.5, 0.08, currentInstrument);
                    playNote(220, 2.5, 0.06, currentInstrument);
                    playNote(330, 2.5, 0.04, currentInstrument);
                }, 200);
            }
        }
        loop();
    }

    function resetPlayer() {
        isPlaying = false;
        if (animationId) cancelAnimationFrame(animationId);
        progress = 0;
        startTime = 0;
        playBtn.textContent = '▶ Играть';
        status.textContent = '⟲ Сброшено';
        drawShapes(0);
        playNote(800, 0.05, 0.02, currentInstrument);
    }

    // ================================================================
    // 6. ЗАГРУЗКА ФАЙЛА
    // ================================================================
    function loadSVG(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            shapes = parseSVG(text);
            // Мини-превью
            miniPreview.innerHTML = `✅ <span style="color:#6fc1b0;">${file.name}</span> (${shapes.length} фигур)`;
            drawShapes(0);
            status.textContent = `✅ Загружено: ${file.name}`;
            // Короткий привет
            for (let i = 0; i < Math.min(shapes.length, 3); i++) {
                setTimeout(() => { playNote(200 + i * 80, 0.1, 0.03, 'piano'); }, i * 80);
            }
        };
        reader.readAsText(file);
    }

    // ================================================================
    // 7. СОБЫТИЯ
    // ================================================================
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#e0dcc8'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#2a3040'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#2a3040';
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.svg')) loadSVG(file);
        else status.textContent = '❌ Нужен файл .svg';
    });
    fileInput.addEventListener('change', (e) => {
        if (fileInput.files[0]) loadSVG(fileInput.files[0]);
    });

    playBtn.addEventListener('click', play);
    resetBtn.addEventListener('click', resetPlayer);
    instrumentSelect.addEventListener('change', () => {
        currentInstrument = instrumentSelect.value;
        status.textContent = `🎸 Инструмент: ${currentInstrument === 'sitar' ? 'Ситар' : 'Фортепиано'}`;
    });

    // Стартовая отрисовка
    drawShapes(0);
    status.textContent = '⏳ Ожидание SVG-партитуры';
</script>
</body>
</html>
